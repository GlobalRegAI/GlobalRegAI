<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlobalRegAI Extension Popup</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .badge {
      font-size: 10px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .card-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .status-val {
      font-size: 14px;
      font-weight: 600;
      color: #10b981;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    button:hover {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">G</div>
    <div>
      <div class="title">GlobalRegAI Agent</div>
      <div class="badge">Manifest V3 Active</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Extension Status</div>
    <div class="status-val" id="extension_status">Ready to Inject</div>
  </div>

  <div class="card">
    <div class="card-title">Remediation Sync</div>
    <div style="font-size: 12px; color: #cbd5e1;">KGMP / ISO13485 3-Year Gap Auto-Fill Ready</div>
  </div>

  <button id="trigger_autofill_btn">🚀 Auto-Fill GMP Submission Portal</button>

  <script src="popup.js"></script>
</body>
</html>
