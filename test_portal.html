<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFDS / FDA Regulatory Portal - Digital Submission Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 28px;
    }

    .badge-gov {
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .sub-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #d1d5db;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .action-bar {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .btn-agent {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .status-box {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <span class="badge-gov">Official Regulatory Agency Portal</span>
        <h1 style="margin-top: 8px;">GMP Compliance Dossier Submission</h1>
        <div class="sub-title">Annual Quality Review & Validation Compliance Submission Portal</div>
      </div>
      <button class="btn btn-agent" id="trigger_agent_fill_btn" onclick="triggerAgentAutoFill()">
        🤖 Trigger GlobalRegAI Agent Auto-Fill
      </button>
    </div>

    <form id="gmp_portal_form" onsubmit="event.preventDefault(); alert('Form Submitted to Regulatory Authorities!');">
      <div class="form-grid">
        <div class="form-group">
          <label for="product_name">Product Name (제품명)</label>
          <input type="text" id="product_name" name="product_name" placeholder="e.g. RegenBio Injectable Solution 50mg">
        </div>

        <div class="form-group">
          <label for="batch_size">Batch Size (제조 배치 사이즈)</label>
          <input type="text" id="batch_size" name="batch_size" placeholder="e.g. 50,000 Vials">
        </div>

        <div class="form-group">
          <label for="hbel_value">Cleaning HBEL / PDE Value (세척 밸리데이션 잔류 허용 기준)</label>
          <input type="text" id="hbel_value" name="hbel_value" placeholder="e.g. 0.01 mg/day toxicological limit">
        </div>

        <div class="form-group">
          <label for="revalidation_cycle">Process Re-Validation Cycle (공정 밸리데이션 주기)</label>
          <input type="text" id="revalidation_cycle" name="revalidation_cycle" placeholder="e.g. 3 Years (Mandatory Cycle)">
        </div>

        <div class="form-group full-width">
          <label for="validation_summary">Validation Executive Summary (밸리데이션 요약)</label>
          <textarea id="validation_summary" name="validation_summary" placeholder="Provide validation review executive summary..."></textarea>
        </div>

        <div class="form-group full-width">
          <label for="remediation_action">Remediation & CAPA Action Plan (보완 조치 계획서)</label>
          <textarea id="remediation_action" name="remediation_action" placeholder="Detail corrective and preventive actions for detected gaps..."></textarea>
        </div>
      </div>

      <div class="action-bar">
        <div class="status-box" id="auto_fill_status">
          Status: Awaiting Data Input...
        </div>
        <button type="submit" class="btn btn-primary">
          📤 Submit Dossier to Regulatory Portal
        </button>
      </div>
    </form>
  </div>

  <script src="extension/content_script.js"></script>
  <script>
    function triggerAgentAutoFill() {
      window.postMessage({
        action: "AUTO_FILL_GMP_PORTAL",
        payload: {
          product_name: "RegenBio Injectable Solution 50mg",
          batch_size: "50,000 Vials",
          validation_summary: "Audit-Ready Remediation Plan Activated: 2 Gap(s) Addressed under KGMP/ISO13485 standards.",
          hbel_value: "0.01 mg/day (PDE calculated per PIC/S PI 006-3)",
          revalidation_cycle: "3 Years (Cycle Reset & Protocol PV-2026-R1 Issued)",
          remediation_action: "CAPA-20260818-01: HBEL toxicological report appended & 3-year PV cycle scheduled."
        }
      }, "*");
    }
  </script>
</body>
</html>
